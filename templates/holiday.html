<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holidays</title>
</head>
<body>
    <table>
        <tr>
            <th>Holiday Names</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Duration</th>
        </tr>
        {% for row in data %}

        <tr>
            <td>{{row.holidayName}}</td>
            <td>{{row.startDate}}</td>
            <td>{{row.endDate}}</td>
            <td>{{row.duration}}</td>
        </tr>
        {% endfor %}
    
    </table>
</body>
</html>
